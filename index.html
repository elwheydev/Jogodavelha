<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Neon Tic Tac Toe</title>
<style>
body{
  margin:0;
  background:black;
  font-family:Arial;
  color:#0ff;
  text-align:center;
}

h1{
  text-shadow:0 0 20px #0ff;
}

button{
  padding:12px 25px;
  margin:10px;
  background:#0ff;
  border:none;
  font-weight:bold;
  cursor:pointer;
  box-shadow:0 0 15px #0ff;
}

#menu{
  margin-top:80px;
}

#game{
  display:none;
}

#board{
  width:300px;
  margin:20px auto;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:5px;
}

.cell{
  width:100px;
  height:100px;
  font-size:50px;
  background:#111;
  border:2px solid #0ff;
  color:#0ff;
  cursor:pointer;
  box-shadow:0 0 10px #0ff;
}

#score{
  font-size:18px;
  margin-top:10px;
}

#rewardScreen{
  display:none;
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.95);
  color:#0ff;
  padding-top:100px;
}

canvas{ display:none; }
</style>
</head>
<body>

<h1>NEON TIC TAC TOE</h1>

<div id="menu">
  <h2>Escolha a dificuldade</h2>
  <button onclick="startGame('easy')">Fácil (1pt)</button>
  <button onclick="startGame('medium')">Médio (5pts)</button>
  <button onclick="startGame('hard')">Difícil (10pts)</button>
</div>

<div id="game">
  <div id="board"></div>
  <div id="score">Pontos: <span id="points">0</span></div>
</div>

<div id="rewardScreen">
  <h2>🎉 META 100 PTS ATINGIDA 🎉</h2>
  <p id="rewardText"></p>
  <button onclick="downloadReward()">Baixar Resultado</button>
  <button onclick="closeReward()">Continuar</button>
</div>

<canvas id="canvas" width="400" height="300"></canvas>

<script>
let board=[];
let gameActive=true;
let points=0;
let difficulty="easy";

const boardDiv=document.getElementById("board");
const pointsSpan=document.getElementById("points");

function startGame(level){
  difficulty=level;
  document.getElementById("menu").style.display="none";
  document.getElementById("game").style.display="block";
  createBoard();
}

function createBoard(){
  boardDiv.innerHTML="";
  board=["","","","","","","","",""];
  for(let i=0;i<9;i++){
    const cell=document.createElement("div");
    cell.classList.add("cell");
    cell.dataset.index=i;
    cell.onclick=playerMove;
    boardDiv.appendChild(cell);
  }
  gameActive=true;
}

function playerMove(){
  if(!gameActive) return;
  let index=this.dataset.index;
  if(board[index]!="") return;

  board[index]="X";
  this.innerText="X";
  checkGame();
  if(gameActive) setTimeout(aiMove,300);
}

function aiMove(){
  let move=randomMove();
  if(move!=null){
    board[move]="O";
    boardDiv.children[move].innerText="O";
    checkGame();
  }
}

function randomMove(){
  let empty=board.map((v,i)=>v==""?i:null).filter(v=>v!=null);
  if(empty.length==0) return null;
  return empty[Math.floor(Math.random()*empty.length)];
}

function checkWinner(player){
  const wins=[
    [0,1,2],[3,4,5],[6,7,8],
    [0,3,6],[1,4,7],[2,5,8],
    [0,4,8],[2,4,6]
  ];
  return wins.some(combo=>combo.every(i=>board[i]==player));
}

function checkGame(){
  if(checkWinner("X")){
    addPoints();
    resetGame();
  }
  else if(checkWinner("O")){
    resetGame();
  }
  else if(!board.includes("")){
    resetGame();
  }
}

function addPoints(){
  if(difficulty=="easy") points+=1;
  if(difficulty=="medium") points+=5;
  if(difficulty=="hard") points+=10;

  pointsSpan.innerText=points;

  if(points>=100){
    reward();
  }
}

function resetGame(){
  gameActive=false;
  setTimeout(createBoard,800);
}

function reward(){
  let now=new Date();
  let text="Meta 100 Pontos!\nData: "+now.toLocaleDateString()+
           "\nHora: "+now.toLocaleTimeString()+
           "\nTotal Pontos: "+points+
           "\nModo: "+difficulty;

  document.getElementById("rewardText").innerText=text;
  document.getElementById("rewardScreen").style.display="block";
  generateImage(text);
}

function closeReward(){
  document.getElementById("rewardScreen").style.display="none";
}

function generateImage(text){
  let canvas=document.getElementById("canvas");
  let ctx=canvas.getContext("2d");
  ctx.fillStyle="black";
  ctx.fillRect(0,0,400,300);
  ctx.fillStyle="#0ff";
  ctx.font="20px Arial";
  text.split("\n").forEach((line,i)=>{
    ctx.fillText(line,20,50+(i*30));
  });
}

function downloadReward(){
  let canvas=document.getElementById("canvas");
  let link=document.createElement("a");
  link.download="recompensa.png";
  link.href=canvas.toDataURL();
  link.click();
}
</script>

</body>
</html>
